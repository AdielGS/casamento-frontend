<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel dos Noivos | Adiel & Julia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#eef5fa] text-slate-800 min-h-screen p-6">

  <!-- Tela de Login Inicial -->
  <div id="tela-login" class="max-w-md mx-auto mt-20 bg-white p-8 rounded-3xl shadow-sm border border-sky-100 text-center">
    <h2 class="font-serif text-2xl text-[#c5a059] font-bold mb-2">Acesso dos Noivos</h2>
    <p class="text-sm text-slate-500 mb-6">Digite a senha para gerenciar a lista de presentes</p>
    <input type="password" id="senha-admin" placeholder="Senha de acesso" 
           class="w-full p-3 border border-sky-200 rounded-xl mb-4 text-center focus:outline-none focus:ring-2 focus:ring-sky-400" />
    <button onclick="autenticar()" 
            class="w-full bg-[#009ee3] hover:bg-[#0082ba] text-white py-3 rounded-xl font-medium transition shadow-sm">
      Entrar no Painel
    </button>
  </div>

  <!-- Painel Principal -->
  <div id="painel-principal" class="hidden max-w-5xl mx-auto space-y-10">
    
    <div class="flex justify-between items-center border-b border-sky-200 pb-4">
      <div>
        <h1 class="font-serif text-3xl text-slate-800 font-bold">Painel de Presentes</h1>
        <p class="text-sm text-slate-500">Adicione, edite ou acompanhe as compras dos convidados</p>
      </div>
      <a href="presentes.html" target="_blank" class="text-xs uppercase tracking-wider font-semibold text-sky-600 bg-white border border-sky-200 px-4 py-2 rounded-xl hover:bg-sky-50 transition">
        Ver lista no ar ↗
      </a>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-sky-100">
      <h3 class="font-serif text-xl text-[#c5a059] font-semibold mb-6">Cadastrar Novo Presente</h3>
      
      <form id="form-novo-presente" onsubmit="salvarPresente(event)" class="grid md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome do Presente</label>
          <input type="text" id="cad-nome" placeholder="Ex: Jantar Japonês na Lua de Mel" required 
                 class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Valor (R$)</label>
          <input type="number" step="0.01" id="cad-valor" placeholder="Ex: 150.00" required 
                 class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Descrição</label>
          <input type="text" id="cad-descricao" placeholder="Ex: Para curtirmos um momento romântico a dois" 
                 class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none" />
        </div>

        <!-- Upload com Preview -->
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Foto do Presente</label>
          <div class="flex items-center gap-6 p-4 border-2 border-dashed border-sky-200 rounded-2xl bg-sky-50/50">
            <div class="w-20 h-20 rounded-xl bg-white border border-slate-200 overflow-hidden shrink-0">
              <img id="img-preview" src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=200&q=80" 
                   alt="Preview" class="w-full h-full object-cover">
            </div>
            <div>
              <input type="file" id="cad-arquivo-foto" accept="image/*" onchange="processarFoto(event, 'preview-novo')" 
                     class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-sky-100 file:text-sky-700 hover:file:bg-sky-200 cursor-pointer" />
            </div>
          </div>
        </div>

        <div class="md:col-span-2">
          <button type="submit" id="btn-salvar" class="bg-[#009ee3] hover:bg-[#0082ba] text-white px-8 py-3 rounded-xl font-medium transition shadow-sm">
            Adicionar Presente à Lista
          </button>
        </div>
      </form>
    </div>

    <!-- Tabela de Presentes Cadastrados -->
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-sky-100">
      <h3 class="font-serif text-xl text-slate-800 font-semibold mb-4">Gerenciar Presentes</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-xs uppercase text-slate-400 border-b border-slate-100">
            <tr>
              <th class="p-3">Item</th>
              <th class="p-3">Valor</th>
              <th class="p-3">Status</th>
              <th class="p-3">Comprador</th>
              <th class="p-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-admin" class="divide-y divide-slate-100">
            <!-- Renderizado via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- MODAL DE EDIÇÃO -->
  <div id="modal-editar" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-lg w-full shadow-xl border border-sky-100 space-y-5">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-serif text-xl text-slate-800 font-semibold">Editar Presente</h3>
        <button onclick="fecharModalEditar()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <form id="form-editar" onsubmit="atualizarPresente(event)" class="space-y-4">
        <input type="hidden" id="edit-id" />

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome</label>
          <input type="text" id="edit-nome" required class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Valor (R$)</label>
            <input type="number" step="0.01" id="edit-valor" required class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Status</label>
            <select id="edit-status" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm">
              <option value="DISPONIVEL">DISPONIVEL</option>
              <option value="COMPRADO">COMPRADO</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Descrição</label>
          <input type="text" id="edit-descricao" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-400 focus:outline-none text-sm" />
        </div>

        <!-- Trocar Imagem Opcional -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trocar Foto (Opcional)</label>
          <div class="flex items-center gap-4">
            <img id="edit-img-preview" src="" class="w-14 h-14 object-cover rounded-xl border border-slate-200">
            <input type="file" accept="image/*" onchange="processarFoto(event, 'preview-edit')" 
                   class="text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-sky-100 file:text-sky-700 cursor-pointer" />
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
          <button type="button" onclick="fecharModalEditar()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50">
            Cancelar
          </button>
          <button type="submit" id="btn-atualizar" class="px-5 py-2.5 rounded-xl bg-[#009ee3] hover:bg-[#0082ba] text-white text-xs font-semibold transition">
            Salvar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8080/api/presentes";
    const SENHA_MESTRA = "adiellindo";
    
    let imagemBase64Novo = "";
    let imagemBase64Edit = "";
    let presentesCache = []; // Guarda a lista para preencher a modal rápido

    function autenticar() {
      const input = document.getElementById("senha-admin").value;
      if (input === SENHA_MESTRA) {
        document.getElementById("tela-login").classList.add("hidden");
        document.getElementById("painel-principal").classList.remove("hidden");
        carregarTabelaAdmin();
      } else {
        alert("Senha incorreta!");
      }
    }

    function processarFoto(event, tipo) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 600;
          const scale = MAX_WIDTH / img.width;
          canvas.width = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
          canvas.height = (img.width > MAX_WIDTH) ? (img.height * scale) : img.height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const base64 = canvas.toDataURL("image/jpeg", 0.7);

          if (tipo === 'preview-novo') {
            imagemBase64Novo = base64;
            document.getElementById("img-preview").src = base64;
          } else {
            imagemBase64Edit = base64;
            document.getElementById("edit-img-preview").src = base64;
          }
        };
      };
      reader.readAsDataURL(file);
    }

    async function carregarTabelaAdmin() {
      const res = await fetch(`${API_URL}/todos`);
      presentesCache = await res.json();
      const tbody = document.getElementById("tabela-admin");

      tbody.innerHTML = presentesCache.map(item => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 font-medium text-slate-800 flex items-center gap-3">
            <img src="${item.imagemUrl || 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=100&q=80'}" class="w-10 h-10 object-cover rounded-lg border border-slate-200">
            ${item.nome}
          </td>
          <td class="p-3 font-semibold text-[#c5a059]">R$ ${Number(item.valor).toFixed(2).replace('.', ',')}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${item.status === 'COMPRADO' ? 'bg-emerald-100 text-emerald-700' : 'bg-sky-100 text-sky-700'}">
              ${item.status}
            </span>
          </td>
          <td class="p-3 text-xs text-slate-500">${item.compradorNome || '-'}</td>
          <td class="p-3 text-right space-x-3">
            <button onclick="abrirModalEditar(${item.id})" class="text-xs text-sky-600 hover:text-sky-800 font-semibold">Editar</button>
            <button onclick="excluirPresente(${item.id})" class="text-xs text-red-500 hover:text-red-700 font-medium">Excluir</button>
          </td>
        </tr>
      `).join('');
    }

    async function salvarPresente(e) {
      e.preventDefault();
      const btn = document.getElementById("btn-salvar");
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const novo = {
        nome: document.getElementById("cad-nome").value,
        valor: parseFloat(document.getElementById("cad-valor").value),
        descricao: document.getElementById("cad-descricao").value,
        imagemUrl: imagemBase64Novo || "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600&q=80"
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(novo)
        });

        if (res.ok) {
          alert("Presente cadastrado com sucesso!");
          document.getElementById("form-novo-presente").reset();
          document.getElementById("img-preview").src = "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=200&q=80";
          imagemBase64Novo = "";
          carregarTabelaAdmin();
        } else {
          alert("Erro ao salvar presente.");
        }
      } catch (err) {
        alert("Erro de conexão ao salvar presente.");
      } finally {
        btn.innerText = "Adicionar Presente à Lista";
        btn.disabled = false;
      }
    }

    // Modal de Edição
    function abrirModalEditar(id) {
      const item = presentesCache.find(p => p.id === id);
      if (!item) return;

      document.getElementById("edit-id").value = item.id;
      document.getElementById("edit-nome").value = item.nome;
      document.getElementById("edit-valor").value = item.valor;
      document.getElementById("edit-descricao").value = item.descricao || '';
      document.getElementById("edit-status").value = item.status;
      document.getElementById("edit-img-preview").src = item.imagemUrl || 'https://images.unsplash.com/photo-1513151233558-d860c5398176?w=200&q=80';
      
      imagemBase64Edit = ""; // Limpa qualquer upload prévio
      document.getElementById("modal-editar").classList.remove("hidden");
    }

    function fecharModalEditar() {
      document.getElementById("modal-editar").classList.add("hidden");
    }

    async function atualizarPresente(e) {
      e.preventDefault();
      const id = document.getElementById("edit-id").value;
      const btn = document.getElementById("btn-atualizar");
      btn.innerText = "Atualizando...";
      btn.disabled = true;

      const dados = {
        nome: document.getElementById("edit-nome").value,
        valor: parseFloat(document.getElementById("edit-valor").value),
        descricao: document.getElementById("edit-descricao").value,
        status: document.getElementById("edit-status").value,
        imagemUrl: imagemBase64Edit // se vazio, o backend mantém a imagem anterior
      };

      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        if (res.ok) {
          alert("Presente atualizado com sucesso!");
          fecharModalEditar();
          carregarTabelaAdmin();
        } else {
          alert("Erro ao atualizar o presente.");
        }
      } catch (err) {
        alert("Erro de conexão ao atualizar.");
      } finally {
        btn.innerText = "Salvar Alterações";
        btn.disabled = false;
      }
    }

    async function excluirPresente(id) {
      if (confirm("Tem certeza que deseja remover este presente?")) {
        await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        carregarTabelaAdmin();
      }
    }
  </script>
</body>
</html>
